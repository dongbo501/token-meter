name: token-meter
services:
  panel:
    image: ghcr.io/dongbo501/token-meter:latest
    ports:
      - "127.0.0.1:8080:8080"
    dns:
      - 172.17.0.1
    environment:
      BILLING_TZ: Asia/Shanghai
      WEEK_START: "0"
      REQUEST_LOG_DAYS: "14"
      REQUEST_LOG_MAX_ROWS: "50000"
      STORAGE_MODE: memory
      CHECKPOINT_SECONDS: "300"
    volumes:
      - meter-data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    restart: unless-stopped
    stop_grace_period: 3630s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  meter-data:
